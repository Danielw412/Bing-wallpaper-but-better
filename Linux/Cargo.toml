[package]
name = "daily-wallpaper"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Sets the Bing image of the day as the GNOME wallpaper, once per day"
license = "MIT"
publish = false

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
