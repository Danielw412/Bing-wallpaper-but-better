# daily-wallpaper configuration. Every key is optional; these are the defaults.

# Wallpaper source. Only "bing" is supported for now.
provider = "bing"
# Bing market (region/language), e.g. "en-US", "en-GB", "de-DE", "ja-JP".
market = "en-US"
# Bing image size: "UHD" (largest available, usually 3840x2160) or e.g. "1920x1080".
resolution = "UHD"

[cache]
# How many recent wallpapers to keep for `previous` / `next`.
keep = 7

[wallpaper]
# GNOME picture-options: zoom, scaled, centered, stretched, spanned or wallpaper.
mode = "zoom"
